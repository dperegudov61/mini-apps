<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка — Mini Apps</title>
<meta name="theme-color" content="#070d18">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">

  <header class="bar">
    <a class="back" href="../../" title="Все приложения" aria-label="Все приложения">‹</a>
    <h1>Змейка</h1>
    <div class="pill"><span>Очки</span><b id="score">0</b></div>
  </header>

  <div class="diffs" id="diffs" role="group" aria-label="Сложность">
    <button type="button" data-diff="easy"><span>Легко</span><i>×1</i></button>
    <button type="button" data-diff="normal" class="on"><span>Обычно</span><i>×2</i></button>
    <button type="button" data-diff="hard"><span>Сложно</span><i>×3</i></button>
  </div>

  <div class="recs">
    <div class="rec" id="recMine" title="Личный рекорд">
      <span class="ico">👤</span>
      <b id="recMineVal">0</b>
      <span class="pos" id="recMinePos"></span>
    </div>
    <button class="rec" id="recGlob" type="button" hidden title="Общий рекорд — открыть таблицу">
      <span class="ico">🌍</span>
      <b id="recGlobVal">—</b>
      <span class="pos" id="recGlobName"></span>
    </button>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Игровое поле"></canvas>
    <div class="overlay" id="ov">
      <div class="panel">
        <h2 id="ovTitle">Змейка</h2>
        <p id="ovText">Стрелки или WASD — движение.<br>Пробел — пауза, R — заново.</p>
        <button class="btn" id="btn" type="button">Играть</button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad" aria-hidden="true">
    <button type="button" class="key up" data-dir="up" aria-label="Вверх">▲</button>
    <button type="button" class="key left" data-dir="left" aria-label="Влево">◀</button>
    <button type="button" class="key down" data-dir="down" aria-label="Вниз">▼</button>
    <button type="button" class="key right" data-dir="right" aria-label="Вправо">▶</button>
  </div>

  <p class="hint">Стрелки или WASD, пробел — пауза, R — заново. На телефоне — свайп или кнопки.</p>
  <p class="hint" id="hintAuth" hidden>🌍 — таблица рекордов, 👤 — твой рекорд и место.</p>
</div>

<!-- таблица рекордов -->
<div class="sheet" id="board" hidden>
  <div class="sheetBox" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
    <div class="shTop">
      <h2 id="boardTitle">Рекорды · <span id="boardDiff">Обычно</span></h2>
      <button class="shClose" id="boardClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="tableWrap">
      <table>
        <thead><tr><th>#</th><th>Имя</th><th>id</th><th>Рекорд</th></tr></thead>
        <tbody id="boardRows"></tbody>
      </table>
    </div>
    <p class="shNote" id="boardNote"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
