<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Apps</title>
<meta name="theme-color" content="#070d18">
<style>
  :root{--bg:#070d18;--panel:#0e1729;--line:rgba(120,170,255,.16);--text:#e8eefc;--dim:#8ea2c4;--accent:#37d67a}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100%;
    background:radial-gradient(1100px 700px at 50% -20%,#16264a 0%,#070d18 62%) fixed,#070d18;
    color:var(--text);
    font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{width:min(100%,980px);margin:0 auto}
  header{margin:0 0 24px}
  h1{margin:0 0 6px;font-size:clamp(26px,6vw,40px);letter-spacing:-.02em}
  p.lead{margin:0;color:var(--dim);max-width:60ch}
  .grid{
    margin-top:26px;
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  }
  a.card{
    display:flex;align-items:center;gap:14px;
    padding:14px;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    color:inherit;text-decoration:none;
    transition:transform .15s ease,border-color .15s ease,background .15s ease;
  }
  a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:rgba(120,170,255,.4);background:rgba(255,255,255,.06);outline:none}
  a.card img{width:56px;height:56px;border-radius:14px;flex:none;background:#0a1220}
  .t{min-width:0}
  .t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t span{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{margin-top:26px;padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--dim)}
  footer{margin-top:34px;color:var(--dim);font-size:13px}
  footer a{color:#9fc6ff}
  code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini Apps</h1>
    <p class="lead">Маленькие самодостаточные приложения: одно приложение — одна папка, без сборки и без внешних библиотек.</p>
  </header>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Список пуст.</div>

  <footer>
    Правила и инструкции — <a href="README.md">README.md</a>. Новое приложение: скопировать
    <code>templates/basic/</code> в <code>apps/&lt;id&gt;/</code> и добавить запись в <code>apps.json</code>.
  </footer>
</div>

<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');

  function card(a) {
    var el = document.createElement('a');
    el.className = 'card';
    el.href = a.path || ('apps/' + a.id + '/');

    var img = document.createElement('img');
    img.src = a.icon || ('apps/' + a.id + '/icon.png');
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function () { img.removeAttribute('src'); img.style.background = '#132039'; };

    var box = document.createElement('div');
    box.className = 't';
    var title = document.createElement('b');
    title.textContent = a.nameRu ? a.nameRu + ' · ' + a.name : a.name;
    var sub = document.createElement('span');
    sub.textContent = a.descriptionRu || a.description || a.id;
    box.appendChild(title);
    box.appendChild(sub);

    el.appendChild(img);
    el.appendChild(box);
    return el;
  }

  function fail(msg) {
    empty.hidden = false;
    empty.textContent = msg;
  }

  fetch('apps.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var apps = (data && data.apps) || [];
      if (!apps.length) return fail('Список приложений пуст (apps.json).');
      apps.forEach(function (a) { grid.appendChild(card(a)); });
    })
    .catch(function (e) {
      fail('Не удалось прочитать apps.json (' + e.message + '). Скорее всего была открыта ссылка file:// — каталог работает на GitHub Pages.');
    });
})();
</script>
</body>
</html>
