<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101317">
<title data-i18n="err.title">Page not found · Mini Apps</title>
<script src="/mini-apps/theme.js" data-i18n="/mini-apps/strings.tsv"></script>
<style>
/* ---------- палитра: тёмная (по умолчанию) и светлая ----------
   Тот же набор переменных, что у остальных страниц (docs\THEME.md). */
:root{
  color-scheme:dark;
  --bg:#101317; --card:#181c22; --area:#1f242c;
  --line:#262c35; --line2:#2b323c; --line3:#3a5a7d;
  --tx:#e3e7ec; --tx2:#8c96a3; --tx3:#69737f;
  --acc:#2f7fd0; --acc2:#3a8de0; --accTx:#fff;
  --lnk:#6aa9e6; --ghost:#2b323c; --ghost2:#333b47; --ghostTx:#fff;
  --shadow:rgba(0,0,0,.45); --mtc:#101317;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6fa; --card:#ffffff; --area:#f1f4f9;
  --line:#e3e8f0; --line2:#d9e0ea; --line3:#9dc0e2;
  --tx:#171d25; --tx2:#55606d; --tx3:#5f6b78;
  --acc:#2f7fd0; --acc2:#2a74c2; --accTx:#fff;
  --lnk:#1c69b8; --ghost:#e8edf4; --ghost2:#dfe5ee; --ghostTx:#1b2330;
  --shadow:rgba(23,32,44,.14); --mtc:#f4f6fa;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;
  padding:18px;font:15px/1.55 -apple-system,'Segoe UI',Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px 20px 18px;box-shadow:0 18px 50px var(--shadow)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.code{font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--tx2);line-height:1}
.top .ui-sw{margin-left:auto}
h1{margin:0 0 6px;font-size:20px;letter-spacing:-.2px}
p{margin:0 0 16px;color:var(--tx2);font-size:13.5px}
.btn{display:inline-block;padding:10px 14px;border-radius:11px;text-decoration:none;font-size:13.5px;font-weight:600;
  background:var(--acc);color:var(--accTx);border:0;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:var(--ghost);color:var(--ghostTx);margin-left:8px}
.btn.ghost:hover{background:var(--ghost2)}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--tx3);font-size:12px}
.foot a{color:var(--lnk)}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="code">404</span>
    <span class="ui-sw" data-ui="switch"></span>
  </div>
  <h1 data-i18n="err.head">This page does not exist</h1>
  <p data-i18n="err.text">Perhaps the app was removed or the address has a typo. Everything else is one click away.</p>
  <a class="btn" href="https://dperegudov61.github.io/" data-i18n="err.home">🏠 Home page</a>
  <a class="btn ghost" href="https://dperegudov61.github.io/AI-Human-Messenger/" data-i18n="err.chat">Open the chat</a>
  <div class="foot">
    <span data-i18n="err.foot">Mini Apps live inside the project page</span> ·
    <a href="https://github.com/dperegudov61">@dperegudov61</a>
  </div>
</div>
</body>
</html>
